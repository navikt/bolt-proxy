name: Automerge Dependabot PRs

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  automerge:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      checks: read
      statuses: read
    steps:
      - name: Automerge Dependabot PRs
        uses: navikt/automerge-dependabot@69852d2204654904759e85f88f4a45bbf8854905 # v1.8.0
        with:
          token: ${{ github.token }}
          merge-method: squash