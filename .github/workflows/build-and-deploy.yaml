name: Build and deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Run tests
        run: go test ./...

  build-outbound:
    name: Build outbound image
    needs: test
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.build.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and push outbound image
        id: build
        uses: nais/docker-build-push@6394144a53cad0332745f24a8302f5efaf81719a # v1.0.0
        with:
          team: appsec
          image_suffix: outbound
          build_args: BINARY=outbound

  build-inbound:
    name: Build inbound image
    needs: test
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.build.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and push inbound image
        id: build
        uses: nais/docker-build-push@6394144a53cad0332745f24a8302f5efaf81719a # v1.0.0
        with:
          team: appsec
          image_suffix: inbound
          build_args: BINARY=inbound

  deploy-inbound:
    name: Deploy inbound (prod-gcp)
    needs: build-inbound
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Deploy inbound to prod-gcp
        uses: nais/deploy/actions/deploy@427e29c94d911626a023a76f402f6dcae1f840b7 # v3
        env:
          CLUSTER: prod-gcp
          RESOURCE: .nais/inbound-prod-gcp.yaml
          IMAGE: ${{ needs.build-inbound.outputs.image }}

  deploy-outbound:
    name: Deploy outbound
    needs: build-outbound
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        include:
          - cluster: dev-gcp
          - cluster: dev-fss
          - cluster: prod-fss
      fail-fast: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Deploy outbound to ${{ matrix.cluster }}
        uses: nais/deploy/actions/deploy@427e29c94d911626a023a76f402f6dcae1f840b7 # v3
        env:
          CLUSTER: ${{ matrix.cluster }}
          RESOURCE: .nais/outbound-${{ matrix.cluster }}.yaml
          IMAGE: ${{ needs.build-outbound.outputs.image }}
